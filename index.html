<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopKart - Online Shopping</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #131921;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .search {
            width: 45%;
            padding: 12px;
            border-radius: 5px;
            border: none;
        }

        .cart {
            font-size: 18px;
        }

        .banner {
            background: #232f3e;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        .banner h1 {
            margin-bottom: 10px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 30px 40px;
        }

        .product {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .product-box {
            height: 150px;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .product h3 {
            margin-bottom: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            background: #ff9900;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #e68a00;
        }

        footer {
            background: #131921;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ShopKart</div>

    <input class="search" type="text" placeholder="Search products...">

    <div class="cart">🛒 Cart: 0</div>
</header>

<section class="banner">
    <h1>Welcome to ShopKart</h1>
    <p>Everything you need, all in one place.Happy Shopping!</p>
</section>

<section class="products">

    <div class="product">
        <div class="product-box">💻</div>
        <h3>Laptop</h3>
        <p class="price">₹55,000</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <div class="product-box">📱</div>
        <h3>Smartphone</h3>
        <p class="price">₹25,000</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <div class="product-box">🎧</div>
        <h3>Headphones</h3>
        <p class="price">₹2,500</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <div class="product-box">⌚</div>
        <h3>Smart Watch</h3>
        <p class="price">₹4,500</p>
        <button>Add to Cart</button>
    </div>

</section>

<footer>
    <p>© 2026 ShopKart | Online Shopping Platform</p>
</footer>

</body>
</html>
